name: AulaFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aulaflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify · Java 26
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Eclipse Temurin 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Validate container operation scripts
        run: |
          bash -n container/build-image.sh
          bash -n container/create-volume.sh
          bash -n container/healthcheck.sh
          bash -n container/backup.sh
          bash -n container/restore.sh
          bash -n container/verify-release-metadata.sh

      - name: Validate release metadata
        run: bash container/verify-release-metadata.sh

      - name: Show tool versions
        run: |
          java --version
          ./mvnw --version

      - name: Verify with Maven Wrapper
        run: >
          ./mvnw
          --batch-mode
          --no-transfer-progress
          clean
          verify

  container-image:
    name: Container image · Podman
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Eclipse Temurin 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Ensure project scripts are executable
        run: |
          chmod +x mvnw
          chmod +x container/build-image.sh
          chmod +x container/healthcheck.sh

      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Build AulaFlow 1.0.0 image from repository sources
        run: ./container/build-image.sh

      - name: Verify non-root runtime user
        run: |
          podman run --rm \
            --entrypoint id \
            localhost/aulaflow:1.0.0 \
            | grep 'uid=10001(aulaflow) gid=10001(aulaflow)'

      - name: Verify healthcheck metadata
        run: |
          healthcheck="$(
            podman image inspect \
              localhost/aulaflow:1.0.0 \
              --format '{{json .Config.Healthcheck}}'
          )"
          test "$healthcheck" != "null"
          printf '%s\n' "$healthcheck"
