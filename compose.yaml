services:
  aulaflow:
    image: ${AULAFLOW_IMAGE:-localhost/aulaflow:1.0.0}

    environment:
      - AULAFLOW_ADMIN_USERNAME
      - AULAFLOW_ADMIN_PASSWORD
      - AULAFLOW_SESSION_COOKIE_SECURE=${AULAFLOW_SESSION_COOKIE_SECURE:-false}

    ports:
      - "${AULAFLOW_BIND_ADDRESS:-127.0.0.1}:${AULAFLOW_HOST_PORT:-8080}:8080"

    volumes:
      - aulaflow-data:/var/lib/aulaflow

volumes:
  aulaflow-data:
    external: true
    name: ${AULAFLOW_VOLUME_NAME:-aulaflow-data}
